[options]
; ---------------------------------------------------------------------------
; Odoo 18 server configuration
; This file is mounted into the container at /etc/odoo/odoo.conf
; ---------------------------------------------------------------------------

; Database connection (matches the "db" service in docker-compose.yml)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Restrict which databases can be listed/managed from the web UI.
dbfilter = .*

; Custom addons mounted from ./addons on the host
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Networking
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = False

; Logging
log_level = info
logfile = False

; Workers (0 = multi-threaded dev mode; good default for a local install)
workers = 0
